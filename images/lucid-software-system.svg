<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Powertrain ECU software — engineering workflow</title>
  <desc id="desc">Platform drivers in C and C++ feed AUTOSAR integration across BSW, RTE and MCAL. Integration leads to ECU bring-up and debugging, followed by bench validation supported by Python and Shell automation. Validation feedback returns to the driver work. This is a summary of engineering responsibilities, not a proprietary vehicle architecture.</desc>
