<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t"><title id="t">Fuzzy inference pipeline</title><rect width="1200" height="600" rx="28" fill="#e9efff"/><g font-family="Arial,sans-serif"><text x="55" y="85" font-size="20" fill="#6573a8" letter-spacing="3">PYTHON / FUZZY INFERENCE</text><text x="55" y="150" font-size="48" font-weight="700" fill="#17224a">Follow the rules to the result.</text><g fill="#fff" stroke="#aebbe7" stroke-width="2"><rect x="55" y="245" width="230" height="170" rx="20"/><rect x="340" y="245" width="230" height="170" rx="20"/><rect x="625" y="245" width="230" height="170" rx="20"/><rect x="910" y="245" width="230" height="170" rx="20"/></g><g font-size="28" fill="#293d79" font-weight="700"><text x="82" y="305">Inputs</text><text x="365" y="305">Memberships</text><text x="652" y="305">Rules</text><text x="937" y="305">Output</text></g><g font-size="18" fill="#7181ad"><text x="82" y="355">Normalize</text><text x="365" y="355">Low / medium / high</text><text x="652" y="355">Activate &amp; weight</text><text x="937" y="355">Inspect the index</text></g><g stroke="#647adb" stroke-width="4" fill="none"><path d="M290 330h40m-10-10 10 10-10 10M575 330h40m-10-10 10 10-10 10M860 330h40m-10-10 10 10-10 10"/></g><text x="55" y="525" font-size="19" fill="#7582aa">An interpretable AI-method teaching model. No validated forecast is implied.</text></g></svg>
